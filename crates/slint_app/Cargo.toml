[package]
name = "twe_slint"
version = "0.1.0"
edition = "2021"
description = "TweMusic: a native Linux music player with a Slint interface"
license = "MIT"

[dependencies]
slint = "1"
twe_music = { path = "../.." }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[build-dependencies]
slint-build = "1"
