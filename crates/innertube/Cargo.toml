[package]
name = "twe_innertube"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust access to YouTube's InnerTube player API for TweMusic (no UI, no player)"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
