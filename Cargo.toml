[package]
name = "twe_music"
version = "0.1.0"
edition = "2021"
description = "TweMusic engine: library, search, playback, tray, notifications and colours (the Slint app draws it)"
license = "MIT"

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
twe_innertube = { path = "crates/innertube" }
twe_player = { path = "crates/player" }

[workspace]
members = ["crates/innertube", "crates/player", "crates/slint_app"]
# Plain `cargo build` / `cargo test` / `cargo run` cover the Slint app and the crates it uses.
default-members = [".", "crates/innertube", "crates/player", "crates/slint_app"]

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
