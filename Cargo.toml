[package]
name = "twe_music"
version = "0.1.0"
edition = "2021"
description = "A native Linux YouTube Music client built in Rust with a Material 3-inspired interface"
license = "MIT"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
webbrowser = "1"

[workspace]

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
