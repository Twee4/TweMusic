[package]
name = "twe_music"
version = "0.1.0"
edition = "2021"
description = "A native Linux YouTube Music client built in Rust with a Material 3-inspired interface"
license = "MIT"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["http", "image"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
webbrowser = "1"
twe_innertube = { path = "crates/innertube" }
twe_player = { path = "crates/player" }

[workspace]
members = ["crates/innertube", "crates/player", "src-tauri"]
# Plain `cargo build` / `cargo test` (and CI) cover the egui app and the pure-Rust crates in
# crates/ (twe_innertube, twe_player). They don't need the WebKitGTK system libraries that the
# Tauri crate requires; build the webview app explicitly with `cargo build -p twe_music_tauri`.
default-members = [".", "crates/innertube", "crates/player"]

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
